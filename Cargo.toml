[package]
authors = [ "TimWood <jinhopers@gmail.com>" ]
name = "garbage-code-hunter"
version = "0.2.0"
edition = "2021"
description = "A humorous Rust code quality detector that roasts your garbage code"
repository = "https://github.com/TimWood0x10/garbage-code-hunter"
license = "Apache-2.0"

[package.metadata.cargo-machete]
ignored = ["proc-macro2"]

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "extra-traits", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
walkdir = "2.0"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
tokio = { version = "1.52.3", features = ["rt"] }
anyhow = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = "0.20"

[dev-dependencies]
tempfile = "3.27"
criterion = "0.8.2"

[[bench]]
name = "performance_tests"
harness = false
