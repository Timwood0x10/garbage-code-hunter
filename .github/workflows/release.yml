name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'master'  # Only trigger on master branch

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Run full CI pipeline first (only on tags)
  ci:
    name: Run CI Pipeline
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Job 2: Create GitHub Release (only on tags)
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'yourusername'
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read RELEASE_NOTE.md
        id: release_notes
        run: |
          echo "📋 Looking for RELEASE_NOTE.md..."
          if [ -f RELEASE_NOTE.md ]; then
            echo "✅ Found RELEASE_NOTE.md"
            NOTES=$(cat RELEASE_NOTE.md)
            # Escape for GitHub Actions
            NOTES="${NOTES//'%'/'%25'}"
            NOTES="${NOTES//$'\n'/'%0A'}"
            NOTES="${NOTES//$'\r'/'%0D'}"
            echo "notes=$NOTES" >> $GITHUB_OUTPUT
            echo "--- Release Notes Preview ---"
            head -20 RELEASE_NOTE.md
          else
            echo "⚠️ No RELEASE_NOTE.md found, using default message"
            echo "notes=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate version format
        id: validate_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION (must be X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version validated: $VERSION"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.validate_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false  # Use our custom notes from RELEASE_NOTE.md
          files: ""  # Files will be uploaded by build-release job

  # Job 3: Build and upload release binaries (Linux + Mac only)
  build-release:
    name: Build Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false  # Don't cancel other builds if one fails
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: garbage-code-hunter
            asset_name: garbage-code-hunter-linux-x86_64.tar.gz
          # macOS Apple Silicon (ARM64) - Modern Macs only
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: garbage-code-hunter
            asset_name: garbage-code-hunter-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Build release binary
        env:
          RUSTFLAGS: "-C target-cpu=native"  # Optimize for native CPU
        run: cargo build --release --target ${{ matrix.target }}

      - name: Show binary info
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ -f "$BINARY" ] || [ -f "${BINARY}.exe" ]; then
            echo "📦 Binary built successfully:"
            ls -lh "$BINARY"* 2>/dev/null || true
            file "$BINARY"* 2>/dev/null || true
          else
            echo "❌ Binary not found at $BINARY"
            exit 1
          fi

      - name: Package binary (Unix/Linux/Mac)
        run: |
          cd target/${{ matrix.target }}/release
          
          # Create tarball with proper naming
          ASSET="${{ matrix.asset_name }}"
          tar -czf "$ASSET" "${{ matrix.binary_name }}"
          
          # Show package size
          echo "📦 Package created:"
          ls -lh "$ASSET"
          
          # Set output for upload step
          echo "ASSET_PATH=target/${{ matrix.target }}/release/$ASSET" >> $GITHUB_ENV
          echo "ASSET_NAME=$ASSET" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: ${{ env.ASSET_PATH }}

  # Job 4: Publish to crates.io (optional, manual trigger)
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') && contains(fromJSON('["publish", "all"]'), 'publish')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify package
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Final status check
  release-success:
    name: ✅ Release Status Summary
    runs-on: ubuntu-latest
    needs: [create-release, build-release]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Generate summary
        run: |
          echo "========================================="
          echo "🎉 Release Summary: ${{ github.ref_name }}"
          echo "========================================="
          echo ""
          echo "📅 Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🏷️  Tag: ${{ github.ref }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo ""
          echo "Jobs Status:"
          echo "  📝 Create Release: ${{ needs.create-release.result }}"
          echo "  🔨 Build Binaries: ${{ needs.build-release.result }}"
          echo ""
          
          if [ "${{ needs.create-release.result }}" == "success" ] && \
             [ "${{ needs.build-release.result }}" == "success" ]; then
            echo "========================================="
            echo "✅ Release completed successfully!"
            echo "========================================="
            
            # List all uploaded assets
            echo ""
            echo "📦 Uploaded Assets:"
            echo "  • garbage-code-hunter-linux-x86_64.tar.gz"
            echo "  • garbage-code-hunter-macos-arm64.tar.gz"
            exit 0
          else
            echo "========================================="
            echo "❌ Release failed!"
            echo "========================================="
            exit 1
          fi
