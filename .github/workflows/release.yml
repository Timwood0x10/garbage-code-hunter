name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Run full CI pipeline first
  ci:
    name: Run CI Pipeline
    uses: ./.github/workflows/ci.yml

  # Job 2: Create GitHub Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read RELEASE_NOTE.md
        id: release_notes
        run: |
          if [ -f RELEASE_NOTE.md ]; then
            NOTES=$(cat RELEASE_NOTE.md)
            # Escape for GitHub Actions
            NOTES="${NOTES//'%'/'%25'}"
            NOTES="${NOTES//$'\n'/'%0A'}"
            NOTES="${NOTES//$'\r'/'%0D'}"
            echo "notes=$NOTES" >> $GITHUB_OUTPUT
          else
            echo "notes=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false

  # Job 3: Build and upload release binaries
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: garbage-code-hunter
            asset_name: garbage-code-hunter-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: garbage-code-hunter
            asset_name: garbage-code-hunter-macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: garbage-code-hunter.exe
            asset_name: garbage-code-hunter-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.binary_name }}
          echo "ASSET_PATH=target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz" >> $GITHUB_ENV

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.asset_name }}.zip ${{ matrix.binary_name }}
          echo "ASSET_PATH=target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip" >> $env:GITHUB_ENV

      - name: Upload Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.ASSET_PATH }}
          asset_name: ${{ matrix.asset_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.ASSET_PATH }}
          asset_name: ${{ matrix.asset_name }}.zip
          asset_content_type: application/zip

  # Job 4: Publish to crates.io
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify package
        run: cargo publish --dry-run

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Job 5: Build and publish VSCode extension
  publish-vscode:
    name: Publish VSCode Extension
    runs-on: ubuntu-latest
    needs: create-release
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run compile

      - name: Package extension
        run: |
          npm install -g @vscode/vsce
          vsce package

      - name: Upload VSIX to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: vscode-extension/garbage-code-hunter-*.vsix
          asset_name: garbage-code-hunter-vscode.vsix
          asset_content_type: application/octet-stream

      - name: Publish to VSCode Marketplace
        if: '!github.event.release.prerelease'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish -p ${{ secrets.VSCE_PAT }}

  # Final status
  release-success:
    name: ✅ Release Completed
    runs-on: ubuntu-latest
    needs: [create-release, build-release, publish-crate, publish-vscode]
    if: always()
    steps:
      - name: Check release status
        run: |
          echo "========================================="
          echo "🎉 Release Status: ${{ github.ref_name }}"
          echo "========================================="
          echo "GitHub Release: ${{ needs.create-release.result }}"
          echo "Binaries: ${{ needs.build-release.result }}"
          echo "crates.io: ${{ needs.publish-crate.result }}"
          echo "VSCode Extension: ${{ needs.publish-vscode.result }}"
          echo "========================================="

          if [ "${{ needs.create-release.result }}" == "failure" ] || \
             [ "${{ needs.build-release.result }}" == "failure" ]; then
            echo "❌ Release failed"
            exit 1
          else
            echo "✅ Release completed successfully!"
          fi
